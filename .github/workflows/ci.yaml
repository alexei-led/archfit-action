name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: shellcheck -x scripts/*.sh tests/*.sh tests/fakes/docker
      - name: action.yml is valid YAML
        run: python3 -c "import yaml; yaml.safe_load(open('action.yml'))"

  conformance:
    name: Conformance — envelope schema, transport, edge cases
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tests/validate/go.mod
          cache: false
      - name: Fetch a real engine state document (archfit v3.0.1, pinned by commit and sha256)
        run: |
          # A document the engine emitted, never a stub written to match this action.
          curl -fsSL -o "$RUNNER_TEMP/state.json" \
            https://raw.githubusercontent.com/alexei-led/archfit/0649e504a6761f565086b342d315110feeb27d77/internal/extract/golang/testdata/single-module/baseline.json
          echo "dc621672167ae9fec8158984b718fed2b94e264c652cf5b6b33d21edacdabceb  $RUNNER_TEMP/state.json" | sha256sum --check
      - name: Envelopes for pull_request, push, discovery and baseline; refused events; transport; edge cases
        run: bash tests/run.sh
        env:
          ARCHFIT_TEST_STATE: ${{ runner.temp }}/state.json

  engine:
    name: Pinned engine image (v3.0.1, linux/amd64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tests/validate/go.mod
          cache: false
      - name: Report, baseline capture, comparable report, pull request origin
        run: bash tests/engine-smoke.sh
        env:
          ARCHFIT_FIXTURES_OUT: ${{ runner.temp }}/fixtures
      # The re-anchor fixtures tests/run.sh replays, as this image wrote them.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engine-fixtures
          path: ${{ runner.temp }}/fixtures
          if-no-files-found: error

  action:
    name: Composite wiring (this repository has no policy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: archfit
        uses: ./
        with:
          engine-version: v3.0.1
          image-digest: sha256:9aac269fa350e643054cbe5ced58426b4ed46000f30d60f49564aa605ece2408
      - name: Nothing was measured or sent
        env:
          VERDICT: ${{ steps.archfit.outputs.verdict }}
          PAYLOAD: ${{ steps.archfit.outputs.payload-file }}
          ENVELOPE: ${{ steps.archfit.outputs.envelope-file }}
          APP_STATUS: ${{ steps.archfit.outputs.app-status }}
        run: test -z "$VERDICT$PAYLOAD$ENVELOPE$APP_STATUS"
