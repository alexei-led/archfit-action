name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: shellcheck -x scripts/*.sh tests/*.sh tests/fakes/docker
      - name: action.yml is valid YAML
        run: python3 -c "import yaml; yaml.safe_load(open('action.yml'))"

  conformance:
    name: Conformance — envelope schema, transport, edge cases
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tests/validate/go.mod
          cache: false
      - name: Fetch a real engine state document (archfit v3.0.0, pinned by commit and sha256)
        run: |
          # A document the engine emitted, never a stub written to match this action.
          curl -fsSL -o "$RUNNER_TEMP/state.json" \
            https://raw.githubusercontent.com/alexei-led/archfit/bbd658f008bcc4bc83e063cf305d20dc4508da2e/internal/extract/golang/testdata/single-module/baseline.json
          echo "dc621672167ae9fec8158984b718fed2b94e264c652cf5b6b33d21edacdabceb  $RUNNER_TEMP/state.json" | sha256sum --check
      - name: Envelopes for pull_request, push, discovery and baseline; refused events; transport; edge cases
        run: bash tests/run.sh
        env:
          ARCHFIT_TEST_STATE: ${{ runner.temp }}/state.json

  engine:
    name: Pinned engine image (v3.0.0, linux/amd64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tests/validate/go.mod
          cache: false
      - name: Report, baseline capture, comparable report
        run: bash tests/engine-smoke.sh

  action:
    name: Composite wiring (this repository has no policy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: archfit
        uses: ./
        with:
          engine-version: v3.0.0
          image-digest: sha256:0eab810538fd8e75115f548154edecfe294ee70e1f13e1a158008ded43119909
      - name: Nothing was measured or sent
        env:
          VERDICT: ${{ steps.archfit.outputs.verdict }}
          PAYLOAD: ${{ steps.archfit.outputs.payload-file }}
          ENVELOPE: ${{ steps.archfit.outputs.envelope-file }}
          APP_STATUS: ${{ steps.archfit.outputs.app-status }}
        run: test -z "$VERDICT$PAYLOAD$ENVELOPE$APP_STATUS"
