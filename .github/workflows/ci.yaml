name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: shellcheck -x scripts/*.sh tests/*.sh tests/fakes/docker
      - name: action.yml is valid YAML
        run: python3 -c "import yaml; yaml.safe_load(open('action.yml'))"

  conformance:
    name: Conformance — envelope schema, transport, edge cases
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tests/validate/go.mod
          cache: false
      - name: Verify the unmodified v3.4.0 release capture
        run: echo "958a3de5c00bd41d8221a58381c6f30653ba1ae114f285ec34401954509c5d34  tests/fixtures/state.json" | sha256sum --check
      - name: Envelopes for pull_request, push, discovery and baseline; refused events; transport; edge cases
        run: bash tests/run.sh
        env:
          ARCHFIT_TEST_STATE: tests/fixtures/state.json

  engine:
    name: Pinned engine image (v3.4.0, ${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tests/validate/go.mod
          cache: false
      - name: Report, baseline capture, comparable report, pull request origin
        run: bash tests/engine-smoke.sh
        env:
          ARCHFIT_FIXTURES_OUT: ${{ runner.temp }}/fixtures
      # The re-anchor fixtures tests/run.sh replays, as this image wrote them.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engine-fixtures-${{ matrix.arch }}
          path: ${{ runner.temp }}/fixtures
          if-no-files-found: error

  action:
    name: Composite wiring (this repository has no policy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: archfit
        uses: ./
        with:
          engine-version: v3.4.0
          image-digest: sha256:bdcfe29bf9def9a4f0ae544923bc3e755fdec2c2cd6c46ec353c01e60642896b
      - name: Nothing was measured or sent
        env:
          VERDICT: ${{ steps.archfit.outputs.verdict }}
          PAYLOAD: ${{ steps.archfit.outputs.payload-file }}
          ENVELOPE: ${{ steps.archfit.outputs.envelope-file }}
          APP_STATUS: ${{ steps.archfit.outputs.app-status }}
        run: test -z "$VERDICT$PAYLOAD$ENVELOPE$APP_STATUS"
