name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: shellcheck -x scripts/*.sh tests/*.sh tests/fakes/docker
      - name: action.yml is valid YAML
        run: python3 -c "import yaml; yaml.safe_load(open('action.yml'))"

  conformance:
    name: Conformance — envelope schema, transport, edge cases
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tests/validate/go.mod
          cache: false
      - name: Fetch a real engine state document (archfit v2.3.1, pinned by commit and sha256)
        run: |
          # A document the engine emitted, never a stub written to match this action.
          curl -fsSL -o "$RUNNER_TEMP/state.json" \
            https://raw.githubusercontent.com/alexei-led/archfit/f8877d25ba36d84d3780071580d23486e3d794d0/internal/extract/golang/testdata/single-module/baseline.json
          echo "5e21abbed182589685c88cbc8fa06a763982ca95bf47511c064611e0c0a11cb8  $RUNNER_TEMP/state.json" | sha256sum --check
      - name: Envelopes for pull_request, push, discovery and baseline; refused events; transport; edge cases
        run: bash tests/run.sh
        env:
          ARCHFIT_TEST_STATE: ${{ runner.temp }}/state.json

  engine:
    name: Pinned engine image (v2.3.1, linux/amd64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tests/validate/go.mod
          cache: false
      - name: Report, baseline capture, comparable report
        run: bash tests/engine-smoke.sh

  action:
    name: Composite wiring (this repository has no policy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: archfit
        uses: ./
        with:
          engine-version: v2.3.1
          image-digest: sha256:7d4f73248865e11bbfe244cd477bd0ea8e8cbdc0b7fb2baade8e044b618b2793
      - name: Nothing was measured or sent
        env:
          VERDICT: ${{ steps.archfit.outputs.verdict }}
          PAYLOAD: ${{ steps.archfit.outputs.payload-file }}
          ENVELOPE: ${{ steps.archfit.outputs.envelope-file }}
          APP_STATUS: ${{ steps.archfit.outputs.app-status }}
        run: test -z "$VERDICT$PAYLOAD$ENVELOPE$APP_STATUS"
