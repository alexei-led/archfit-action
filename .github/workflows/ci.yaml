name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: shellcheck -x scripts/*.sh tests/*.sh tests/fakes/docker
      - name: action.yml is valid YAML
        run: python3 -c "import yaml; yaml.safe_load(open('action.yml'))"

  conformance:
    name: Conformance — envelope schema, transport, edge cases
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tests/validate/go.mod
          cache: false
      - name: Envelope 2 for pull_request, push and merge_group; refused events; transport; edge cases
        run: bash tests/run.sh

  engine:
    name: Pinned engine image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tests/validate/go.mod
          cache: false
      - name: Push, pull requests, a re-run, a merge group and the eol case on the real engine
        run: bash tests/engine-smoke.sh
        env:
          ARCHFIT_FIXTURES_OUT: ${{ runner.temp }}/fixtures
      # The results tests/run.sh replays, as this image wrote them.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engine-fixtures-${{ matrix.arch }}
          path: ${{ runner.temp }}/fixtures
          if-no-files-found: error

  action:
    name: Composite wiring (this repository has no policy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No engine inputs: the consumer form, with the engine this release pins.
      - id: archfit
        uses: ./
      - name: Nothing was measured or sent
        env:
          VERDICT: ${{ steps.archfit.outputs.verdict }}
          PAYLOAD: ${{ steps.archfit.outputs.payload-file }}
          ENVELOPE: ${{ steps.archfit.outputs.envelope-file }}
          APP_STATUS: ${{ steps.archfit.outputs.app-status }}
        run: test -z "$VERDICT$PAYLOAD$ENVELOPE$APP_STATUS"
