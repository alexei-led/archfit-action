name: archfit
description: Run the pinned archfit engine image on this repository and report the architecture state to the archfit GitHub App
author: alexei-led
branding:
  icon: git-branch
  color: purple

# Input names are the ones the archfit App writes into its generated workflow.
inputs:
  endpoint:
    description: >-
      archfit App base URL over https, without a trailing slash, for example
      https://archfit.example. Reports go to <endpoint>/v1/reports, discovery
      drafts to <endpoint>/v1/discoveries, captured baselines to
      <endpoint>/v1/baselines and re-anchored baselines to <endpoint>/v1/reanchors.
      Empty means analyze only: nothing is sent, pull requests are measured against
      the base branch's policy, baseline and labels, a blocked verdict fails the
      job, and a captured or re-anchored baseline is an artifact only.
    required: false
    default: ""
  audience:
    description: >-
      OIDC audience of the upload token. Empty means the endpoint, verbatim; the App
      accepts exactly its base URL.
    required: false
    default: ""
  engine-version:
    description: Engine release of the image, for example v3.0.0. The action refuses an image that reports another version.
    required: true
  image-digest:
    description: >-
      Per-platform manifest digest of ghcr.io/alexei-led/archfit (sha256:<64 hex>),
      as listed in the App's manifest. Tags are refused.
    required: true
  mode:
    description: >-
      report (measure and upload the state), discovery (propose a first policy),
      baseline (capture accepted debt) or reanchor (carry the baseline on the default
      branch to this engine and accept nothing new). With an endpoint the App proposes a
      baseline or re-anchor in a pull request, else it is an artifact only. Empty means
      report. Discovery, baseline and reanchor run on the default branch only.
    required: false
    default: ""

outputs:
  verdict:
    description: Engine verdict (healthy, needs_attention or blocked); empty when nothing was measured.
    value: ${{ steps.run.outputs.verdict }}
  payload-file:
    description: The state report, discovery draft, or baseline or re-anchored baseline the engine produced; empty when nothing was measured.
    value: ${{ steps.run.outputs.payload-file }}
  report-file:
    description: The engine's re-anchor report (what it kept, dropped and left unaccepted); empty unless mode is reanchor.
    value: ${{ steps.run.outputs.report-file }}
  envelope-file:
    description: The archfit.report-envelope.v1 line, exactly as sent in the X-Archfit-Envelope header; empty when none was written.
    value: ${{ steps.report.outputs.envelope-file }}
  app-status:
    description: HTTP status of the App's final answer, "000" when no answer arrived; empty when nothing was sent.
    value: ${{ steps.report.outputs.app-status }}
  app-answer:
    description: >-
      The App's JSON answer on one line, for example {"conclusion":"success","reason":"healthy"}
      for a report, {"pull_request":12,"url":"https://github.com/o/r/pull/12"} or
      {"unchanged":true} for a baseline or re-anchor, and {"error":"<code>"} for a refusal.
    value: ${{ steps.report.outputs.app-answer }}

runs:
  using: composite
  steps:
    - id: prepare
      shell: bash
      env:
        ARCHFIT_ENGINE_VERSION: ${{ inputs.engine-version }}
        ARCHFIT_IMAGE_DIGEST: ${{ inputs.image-digest }}
        ARCHFIT_ENDPOINT: ${{ inputs.endpoint }}
        ARCHFIT_MODE: ${{ inputs.mode }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/prepare.sh"

    # Full history for the merge base and the engine's history evidence; no credential
    # left in .git/config, which the engine container mounts.
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ steps.prepare.outputs.ref }}
        fetch-depth: 0
        persist-credentials: false

    - id: run
      shell: bash
      env:
        ARCHFIT_MODE: ${{ steps.prepare.outputs.mode }}
        ARCHFIT_ENDPOINT: ${{ inputs.endpoint }}
        ARCHFIT_ENGINE_VERSION: ${{ inputs.engine-version }}
        ARCHFIT_IMAGE_DIGEST: ${{ inputs.image-digest }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/run.sh"

    # Before the upload, so the result survives a failed upload. archfit-report is the
    # name the App's graph view reads: one file, the exact report bytes.
    - if: steps.run.outputs.payload-file != ''
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ steps.run.outputs.artifact-name }}
        path: |
          ${{ steps.run.outputs.payload-file }}
          ${{ steps.run.outputs.report-file }}
        if-no-files-found: error
        include-hidden-files: true
        overwrite: true

    - id: report
      shell: bash
      env:
        ARCHFIT_FACTS: ${{ steps.run.outputs.facts-file }}
        ARCHFIT_ENDPOINT: ${{ inputs.endpoint }}
        ARCHFIT_AUDIENCE: ${{ inputs.audience }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/report.sh"
