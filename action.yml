name: archfit
description: Run the pinned archfit engine image on this change and send its result to the archfit GitHub App
author: alexei-led
branding:
  icon: git-branch
  color: purple

# Input names are the ones the archfit App writes into its generated workflow.
inputs:
  endpoint:
    description: >-
      archfit App base URL over https, without a trailing slash, for example
      https://archfit.example. Results go to <endpoint>/v1/reports. Empty means
      check only: nothing is sent, the change is still judged by the policy of the
      target branch, and the job fails unless the status is pass.
    required: false
    default: ""
  audience:
    description: >-
      OIDC audience of the upload token. Empty means the endpoint, verbatim; the App
      accepts exactly its base URL.
    required: false
    default: ""
  engine-version:
    description: >-
      Engine release of the image, for example v4.0.0-rc.1. Empty means the engine this
      action release pins. The action refuses an image that reports another version.
    required: false
    default: ""
  image-digest:
    description: >-
      Per-platform manifest digest of ghcr.io/alexei-led/archfit (sha256:<64 hex>),
      as listed in the App's manifest. Empty means the digest this action release
      pins for the runner's platform. Tags are refused.
    required: false
    default: ""
  mode:
    description: >-
      Empty or report. Action 4 has one mode, the check of pull_request, push
      and merge_group runs; any other value is refused.
    required: false
    default: ""

outputs:
  verdict:
    description: Status of the change (pass, fail or unknown); empty when nothing was checked.
    value: ${{ steps.run.outputs.verdict }}
  payload-file:
    description: The engine's result (archfit.result.v1), the bytes the upload carries; empty when nothing was checked.
    value: ${{ steps.run.outputs.payload-file }}
  report-file:
    description: Always empty; Action 4 has no re-anchor report.
    value: ${{ steps.run.outputs.report-file }}
  envelope-file:
    description: The archfit.upload-envelope.v2 line, exactly as sent in the X-Archfit-Envelope header; empty when none was written.
    value: ${{ steps.report.outputs.envelope-file }}
  app-status:
    description: HTTP status of the App's final answer, "000" when no answer arrived; empty when nothing was sent.
    value: ${{ steps.report.outputs.app-status }}
  app-answer:
    description: >-
      The App's JSON answer on one line, for example {"status":"pass"} or
      {"status":"unknown","reason":"policy_changed"} for an accepted result, and
      {"error":"<code>"} for a refusal.
    value: ${{ steps.report.outputs.app-answer }}

runs:
  using: composite
  steps:
    - id: prepare
      shell: bash
      env:
        ARCHFIT_ENGINE_VERSION: ${{ inputs.engine-version }}
        ARCHFIT_IMAGE_DIGEST: ${{ inputs.image-digest }}
        ARCHFIT_ENDPOINT: ${{ inputs.endpoint }}
        ARCHFIT_MODE: ${{ inputs.mode }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/prepare.sh"

    # Full history and every branch, fetched now: the target tip, the merge base and the
    # engine's base. No credential is left in .git/config, which the engine container mounts.
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ steps.prepare.outputs.ref }}
        fetch-depth: 0
        persist-credentials: false

    - id: run
      shell: bash
      env:
        ARCHFIT_ENGINE_VERSION: ${{ steps.prepare.outputs.engine-version }}
        ARCHFIT_IMAGE_DIGEST: ${{ steps.prepare.outputs.image-digest }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/run.sh"

    # Before the upload, so the result survives a failed upload. archfit-result is the
    # name the App reads the result back from: one file, the exact bytes of the upload.
    - if: steps.run.outputs.payload-file != ''
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ steps.run.outputs.artifact-name }}
        path: ${{ steps.run.outputs.payload-file }}
        if-no-files-found: error
        overwrite: true

    - id: report
      shell: bash
      env:
        ARCHFIT_FACTS: ${{ steps.run.outputs.facts-file }}
        ARCHFIT_ENDPOINT: ${{ inputs.endpoint }}
        ARCHFIT_AUDIENCE: ${{ inputs.audience }}
      run: bash "${GITHUB_ACTION_PATH}/scripts/report.sh"
