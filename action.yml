name: archfit
description: Report an archfit architecture-state document to the archfit GitHub App
author: alexei-led
branding:
  icon: git-branch
  color: purple

inputs:
  state-file:
    description: Path to the archfit.architecture-state.v1 document produced by `archfit check --json`.
    required: false
    default: archfit-state.json
  endpoint:
    description: >-
      archfit App ingest URL. When empty the envelope is written to `envelope-file`
      and nothing is sent — which is the supported way to use this action before
      the App backend is available to you.
    required: false
    default: ""
  envelope-file:
    description: Where to write the assembled envelope.
    required: false
    default: archfit-envelope.json
  audience:
    description: OIDC audience to request the token for. Only used when `endpoint` is set.
    required: false
    default: archfit-app

outputs:
  envelope-file:
    description: Path of the written envelope.
    value: ${{ steps.report.outputs.envelope-file }}
  verdict:
    description: The verdict carried by the state document.
    value: ${{ steps.report.outputs.verdict }}

runs:
  using: composite
  steps:
    - id: report
      shell: bash
      env:
        ARCHFIT_STATE_FILE: ${{ inputs.state-file }}
        ARCHFIT_ENDPOINT: ${{ inputs.endpoint }}
        ARCHFIT_ENVELOPE_FILE: ${{ inputs.envelope-file }}
        ARCHFIT_AUDIENCE: ${{ inputs.audience }}
      run: ${GITHUB_ACTION_PATH}/scripts/report.sh
